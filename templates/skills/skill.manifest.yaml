schema: relurpify/skill/v1

apiVersion: relurpify/v1alpha1
kind: SkillManifest

metadata:
  name: "example-skill"
  version: "1.0.0"
  description: "Reusable guidance for a focused workflow."

spec:
  requires:
    bins:
      - git

  prompt_snippets:
    - "Follow the project's review checklist and summarize any risks."

  allowed_capabilities:
    - name: "file_read"
      kind: "tool"
    - name: "file_write"
      kind: "tool"

  tool_execution_policy:
    file_write:
      execute: "ask"

  capability_policies:
    - selector:
        kind: "tool"
        risk_classes: ["execute"]
      execute: "ask"

  policies:
    network: "ask"

  provider_policies:
    remote-mcp:
      activate: "ask"
      default_trust: "remote-declared-untrusted"

  resource_paths:
    scripts: ["scripts"]
    resources: ["resources"]
    templates: ["templates"]
