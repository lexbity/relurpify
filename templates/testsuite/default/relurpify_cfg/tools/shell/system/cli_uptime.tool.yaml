schema: relurpify/tool/v1
name: cli_uptime
version: "1"
family: system
intent:
  - inspect
  - uptime
description: Shows system uptime information.
execution:
  backend: subprocess
  command:
    base:
      - uptime
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
