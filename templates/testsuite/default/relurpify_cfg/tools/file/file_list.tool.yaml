schema: relurpify/tool/v1
name: file_list
version: "1"
family: file
intent:
  - file
description: Lists files recursively using glob filtering.
parameters:
  - name: directory
    type: string
    description: ""
    required: false
    default: .
  - name: pattern
    type: string
    description: ""
    required: false
    default: '*'
execution:
  backend: go_native
  implementation: file_list
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - filesystem_read
