schema: relurpify/tool/v1
name: lsp_get_diagnostics
version: "1"
family: lsp
intent:
  - lsp
description: Retrieves diagnostics for a file.
parameters:
  - name: file
    type: string
    description: ""
    required: true
    default: null
execution:
  backend: go_native
  implementation: lsp_get_diagnostics
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - context_insertion
