schema: relurpify/tool/v1
name: cli_file
version: "1"
family: fileops
intent:
  - inspect
  - metadata
description: Detects file types using the file command.
execution:
  backend: subprocess
  command:
    base:
      - file
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
