schema: relurpify/tool/v1
name: cli_yq
version: "1"
family: text
intent:
  - extract
  - structured_data
description: Processes YAML content using yq.
execution:
  backend: subprocess
  command:
    base:
      - yq
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
