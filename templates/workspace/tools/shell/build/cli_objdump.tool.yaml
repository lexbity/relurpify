schema: relurpify/tool/v1
name: cli_objdump
version: "1"
family: build
intent:
  - inspect
  - native
description: Display information from object files.
execution:
  backend: subprocess
  command:
    base:
      - objdump
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
