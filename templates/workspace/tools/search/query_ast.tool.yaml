schema: relurpify/tool/v1
name: query_ast
version: "1"
family: search
intent:
  - search
description: Query the universal AST index to explore symbols, callers, callees, and dependencies without loading entire files.
parameters:
  - name: action
    type: string
    description: list_symbols|get_signature|find_callers|find_callees|get_imports|get_dependencies|search
    required: true
    default: null
  - name: symbol
    type: string
    description: Target symbol name
    required: false
    default: null
  - name: type
    type: string
    description: Filter by node type
    required: false
    default: null
  - name: category
    type: string
    description: Filter by category
    required: false
    default: null
  - name: exported_only
    type: boolean
    description: Only include exported symbols
    required: false
    default: null
execution:
  backend: go_native
  implementation: query_ast
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - filesystem_read
