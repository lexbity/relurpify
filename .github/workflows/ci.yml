name: ci

on:
  push:
  pull_request:

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # Each commit introduced by this PR must carry a DCO sign-off trailer.
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            # Merge commits (more than one parent) are exempt.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              echo "::error::commit $sha is missing a 'Signed-off-by' line (DCO). Run: git commit -s --amend"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed. See CONTRIBUTING for how to sign off your commits."
            exit 1
          fi
          echo "All PR commits are signed off."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Architecture invariant gates (GP-9)
        run: make lint-arch
      - name: Lint (layering, invariants, boundaries, host-exec)
        run: make lint-all
        continue-on-error: true
      - name: Compile guard (defeat silent-blanking)
        run: |
          go build ./...
          go vet ./...
      - name: Contract dissolution gate
        run: make check-contract-dissolution
      - name: Contract migration baseline
        run: make test-contract-migration
      - name: Architecture grep gates
        run: make grep-architecture-gates
      - name: Slice 10 structural gates (AC-10, AC-12, provider_factory)
        run: make check-gates-slice10
      - name: Dev-agent baseline
        run: make test-dev-agent
      - name: Tape fidelity baseline
        run: make test-tape-fidelity
      - name: Lint Go — ratchet (Track R, new issues only, blocking)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout 5m
          only-new-issues: true
      - name: Lint Go — graduated (Track Z, whole tree, blocking)
        run: |
          graduated=$(grep -vE '^\s*(#|$)' .golangci-graduated.txt | paste -sd,)
          if [ -n "$graduated" ]; then
            out=$(golangci-lint run --enable-only="$graduated" ./... 2>&1) || true
            echo "$out"
            echo "$out" | grep -qE '\(typecheck\)' && { echo "::error::typecheck blanked the run"; exit 1; }
            echo "$out" | grep -qE '\([a-z]+\)$' && { echo "::error::graduated linter regressed"; exit 1; }
          fi
      - name: Lint config boundary
        run: make lint-config-boundary
        continue-on-error: true
      - name: Boundary tests
        run: make test-boundary
        continue-on-error: true
      - name: Check template drift
        run: make check-template-drift
        continue-on-error: true
      - name: Test unit
        run: make test-unit
