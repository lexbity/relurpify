schema: relurpify/workspace/v1

# Workspace-local state lives outside relurpify_cfg/.
paths:
  state_dir: .relurpify_state

model:
  provider: ollama
  name: gemma4:e4b

sandbox:
  backend: gvisor

# Route-selection posture: "deterministic" (default) keeps recipe selection
# reproducible — ties resolve through the deterministic lattice or fall to a
# clarification frame, and no model is consulted for selection.
# "model_assisted" lets the tier-2 disambiguator break ties with the model.
selection:
  posture: deterministic

logging:
  level: info
  format: json

audit:
  # strict: governed actions that cannot be durably recorded fail closed.
  # best_effort: audit drops are counted, never block (availability escape hatch).
  retention_days: 7
  enforcement: strict

telemetry:
  enabled: false

runner:
  enabled: true
  workers: 2
  queues:
    - knowledge
  poll_interval: 500ms
  heartbeat: 5s
  # refresh_interval: the scheduled knowledge.refresh submission cadence.
  # 0 (default) = off: absent, not stubbed.
  refresh_interval: 0s
