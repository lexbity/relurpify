schema: relurpify/policy/sandbox/v1

read_only_root: false
protected_paths:
  - relurpify_cfg
no_new_privileges: true
seccomp_profile: ""
allowed_env_keys: []
denied_env_keys: []
network_rules: []

# Container lifecycle ownership (SBH-1 D-11): reaping orphans of crashed
# sessions at boot, and the absolute age cap beyond which ANY managed
# container is reclaimed.
reap_orphans: true
orphan_max_age: 24h
