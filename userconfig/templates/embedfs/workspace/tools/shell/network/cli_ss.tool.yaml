schema: relurpify/tool/v1
name: cli_ss
version: "1"
family: network
intent:
  - inspect
  - sockets
description: Inspects sockets using ss.
execution:
  backend: subprocess
  command:
    base:
      - ss
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    network_access: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - network
  effect_class:
    - process_spawn
