schema: relurpify/tool/v1
name: cli_ping
version: "1"
family: network
intent:
  - probe
  - icmp
description: Checks host reachability with ping.
execution:
  backend: subprocess
  command:
    base:
      - ping
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
    network_access: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - network
  effect_class:
    - external_state
    - network_egress
    - process_spawn
