schema: relurpify/tool/v1
name: cli_htop
version: "1"
family: system
intent:
  - inspect
  - process
description: Runs htop for interactive process monitoring.
execution:
  backend: subprocess
  command:
    base:
      - htop
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
