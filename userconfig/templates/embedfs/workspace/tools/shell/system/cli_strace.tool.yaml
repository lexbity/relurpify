schema: relurpify/tool/v1
name: cli_strace
version: "1"
family: system
intent:
  - inspect
  - diagnostics
description: Traces syscalls made by a process using strace.
execution:
  backend: subprocess
  command:
    base:
      - strace
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
