schema: relurpify/tool/v1
name: cli_systemctl
version: "1"
family: system
intent:
  - manage
  - service
description: Manages systemd services via systemctl.
execution:
  backend: subprocess
  command:
    base:
      - systemctl
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - destructive
  effect_class:
    - filesystem_read
    - process_spawn
