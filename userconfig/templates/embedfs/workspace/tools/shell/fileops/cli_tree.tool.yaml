schema: relurpify/tool/v1
name: cli_tree
version: "1"
family: fileops
intent:
  - browse
description: Displays directory trees using tree.
execution:
  backend: subprocess
  command:
    base:
      - tree
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
