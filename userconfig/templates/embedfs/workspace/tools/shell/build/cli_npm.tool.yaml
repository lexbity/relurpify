schema: relurpify/tool/v1
name: cli_npm
version: "1"
family: build
intent:
  - build
  - node
description: |
  Escape hatch: Executes arbitrary npm commands.
  Prefer node_npm_test for structured test output.
guidance:
  avoid_when:
    - "The node_npm_test tool handles your use case"
execution:
  backend: subprocess
  command:
    base:
      - npm
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
