schema: relurpify/tool/v1
name: cli_node
version: "1"
family: build
intent:
  - build
  - node
description: Executes Node.js commands inside the workspace.
execution:
  backend: subprocess
  command:
    base:
      - node
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
