schema: relurpify/tool/v1
name: cli_cargo
version: "1"
family: build
intent:
  - build
  - rust
description: Executes Rust cargo commands inside the workspace.
execution:
  backend: subprocess
  command:
    base:
      - cargo
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
