schema: relurpify/tool/v1
name: cli_valgrind
version: "1"
family: build
intent:
  - debug
description: Valgrind instrumentation framework (memcheck, cachegrind, etc).
execution:
  backend: subprocess
  command:
    base:
      - valgrind
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
