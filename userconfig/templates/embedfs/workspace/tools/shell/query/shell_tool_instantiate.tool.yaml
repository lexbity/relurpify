schema: relurpify/tool/v1
name: shell_tool_instantiate
version: "1"
family: shell_query
intent:
  - shell_query
description: Resolves a shell catalog entry and materializes a validated request.
parameters:
  - name: tool_name
    type: string
    description: Canonical tool name to resolve.
    required: false
    default: null
  - name: aliases
    type: array
    description: Tool aliases to resolve.
    required: false
    default: null
  - name: family
    type: string
    description: Family name to resolve if unambiguous.
    required: false
    default: null
  - name: arguments
    type: object
    description: Structured tool arguments to validate and materialize.
    required: false
    default: null
  - name: workspace_context
    type: object
    description: Workspace hints such as cargo, go, python, or git.
    required: false
    default: null
  - name: allow_deprecated
    type: boolean
    description: Allow deprecated tools to be resolved.
    required: false
    default: null
execution:
  backend: go_native
  implementation: shell_tool_instantiate
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - filesystem_read
