schema: relurpify/tool/v1
name: cli_at
version: "1"
family: scheduler
intent:
  - schedule
description: Schedules one-off jobs using at.
execution:
  backend: subprocess
  command:
    base:
      - at
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
