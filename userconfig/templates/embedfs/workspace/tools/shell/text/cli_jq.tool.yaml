schema: relurpify/tool/v1
name: cli_jq
version: "1"
family: text
intent:
  - extract
  - structured_data
description: Queries or transforms JSON using jq.
execution:
  backend: subprocess
  command:
    base:
      - jq
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
    - process_spawn
