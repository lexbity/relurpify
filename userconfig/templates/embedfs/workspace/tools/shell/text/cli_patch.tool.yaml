schema: relurpify/tool/v1
name: cli_patch
version: "1"
family: text
intent:
  - patch
description: Applies unified diffs using patch.
execution:
  backend: subprocess
  command:
    base:
      - patch
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
    - process_spawn
