schema: relurpify/tool/v1
name: cli_perl
version: "1"
family: text
intent:
  - transform
  - script
description: Runs perl for text processing tasks.
execution:
  backend: subprocess
  command:
    base:
      - perl
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
    - process_spawn
