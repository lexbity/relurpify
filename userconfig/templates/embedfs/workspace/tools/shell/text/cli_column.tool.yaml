schema: relurpify/tool/v1
name: cli_column
version: "1"
family: text
intent:
  - format
description: Formats tabular text with column.
execution:
  backend: subprocess
  command:
    base:
      - column
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
