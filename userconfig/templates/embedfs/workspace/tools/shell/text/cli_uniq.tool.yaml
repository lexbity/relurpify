schema: relurpify/tool/v1
name: cli_uniq
version: "1"
family: text
intent:
  - deduplicate
description: Removes duplicate lines using uniq.
execution:
  backend: subprocess
  command:
    base:
      - uniq
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
    - process_spawn
