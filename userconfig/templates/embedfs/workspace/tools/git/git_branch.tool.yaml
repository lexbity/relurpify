schema: relurpify/tool/v1
name: git_branch
version: "1"
family: git
intent:
  - git
description: Creates a new branch.
parameters:
  - name: name
    type: string
    description: ""
    required: true
    default: null
execution:
  backend: go_native
  implementation: git_branch
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - destructive
  effect_class:
    - external_state
