schema: relurpify/tool/v1
name: git_history
version: "1"
family: git
intent:
  - git
description: Retrieves git history for a file.
parameters:
  - name: file
    type: string
    description: ""
    required: true
    default: null
  - name: limit
    type: int
    description: ""
    required: false
    default: 5
execution:
  backend: go_native
  implementation: git_history
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - external_state
