schema: relurpify/tool/v1
name: lsp_format
version: "1"
family: lsp
intent:
  - lsp
description: Formats code using the language server.
parameters:
  - name: file
    type: string
    description: ""
    required: true
    default: null
  - name: code
    type: string
    description: ""
    required: true
    default: null
execution:
  backend: go_native
  implementation: lsp_format
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - destructive
  effect_class:
    - context_insertion
