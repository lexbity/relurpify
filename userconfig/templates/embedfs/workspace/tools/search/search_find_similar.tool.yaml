schema: relurpify/tool/v1
name: search_find_similar
version: "1"
family: search
intent:
  - search
description: Finds structurally similar code snippets.
parameters:
  - name: snippet
    type: string
    description: ""
    required: true
    default: null
  - name: directory
    type: string
    description: ""
    required: false
    default: .
execution:
  backend: go_native
  implementation: search_find_similar
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - filesystem_read
