schema: relurpify/tool/v1
name: file_delete
version: "1"
family: file
intent:
  - file
description: Deletes a file after confirmation.
parameters:
  - name: path
    type: string
    description: ""
    required: true
    default: null
execution:
  backend: go_native
  implementation: file_delete
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - destructive
  effect_class:
    - filesystem_mutation
