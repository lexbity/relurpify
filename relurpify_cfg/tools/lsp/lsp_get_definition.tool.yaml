schema: relurpify/tool/v1
name: lsp_get_definition
version: "1"
family: lsp
intent:
  - lsp
description: Finds the definition for a symbol.
parameters:
  - name: file
    type: string
    description: File path
    required: true
    default: null
  - name: symbol
    type: string
    description: Symbol name
    required: true
    default: null
  - name: line
    type: int
    description: Line number
    required: true
    default: null
  - name: character
    type: int
    description: Character offset
    required: true
    default: null
execution:
  backend: go_native
  implementation: lsp_get_definition
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - context_insertion
