schema: relurpify/tool/v1
name: cli_cargo
version: "1"
family: build
intent:
  - build
  - rust
description: |
  Escape hatch: Executes arbitrary cargo commands.
  Prefer rust_cargo_test, rust_cargo_check, or rust_cargo_metadata for structured output.
guidance:
  avoid_when:
    - "A rust_cargo_test, rust_cargo_check, or rust_cargo_metadata tool handles your use case"
execution:
  backend: subprocess
  command:
    base:
      - cargo
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
