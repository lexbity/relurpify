schema: relurpify/tool/v1
name: cli_gdb
version: "1"
family: build
intent:
  - debug
description: GNU Debugger.
execution:
  backend: subprocess
  command:
    base:
      - gdb
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - destructive
  effect_class:
    - process_spawn
