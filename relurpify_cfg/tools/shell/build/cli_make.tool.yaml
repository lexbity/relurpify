schema: relurpify/tool/v1
name: cli_make
version: "1"
family: build
intent:
  - build
  - verify
description: Runs make targets for builds.
execution:
  backend: subprocess
  command:
    base:
      - make
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
