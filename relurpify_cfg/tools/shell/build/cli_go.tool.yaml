schema: relurpify/tool/v1
name: cli_go
version: "1"
family: build
intent:
  - build
  - go
description: |
  Escape hatch: Executes arbitrary Go commands (go test/build/vet/mod/...).
  Prefer go_test, go_build, or go_module_metadata for structured output.
guidance:
  avoid_when:
    - "The go_test or go_build tool handles your use case"
execution:
  backend: subprocess
  command:
    base:
      - go
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
