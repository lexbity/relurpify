schema: relurpify/tool/v1
name: cli_sqlite3
version: "1"
family: build
intent:
  - build
  - sql
description: |
  Escape hatch: Executes arbitrary sqlite3 commands.
  Prefer sqlite_query, sqlite_schema_inspect, or sqlite_integrity_check for structured output.
guidance:
  avoid_when:
    - "A sqlite_query, sqlite_schema_inspect, or sqlite_integrity_check tool handles your use case"
execution:
  backend: subprocess
  command:
    base:
      - sqlite3
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
