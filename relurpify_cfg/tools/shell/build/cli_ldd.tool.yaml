schema: relurpify/tool/v1
name: cli_ldd
version: "1"
family: build
intent:
  - inspect
  - native
description: Print shared object dependencies.
execution:
  backend: subprocess
  command:
    base:
      - ldd
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
