schema: relurpify/tool/v1
name: cli_cmake
version: "1"
family: build
intent:
  - build
  - configure
description: Configures builds with cmake.
execution:
  backend: subprocess
  command:
    base:
      - cmake
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
