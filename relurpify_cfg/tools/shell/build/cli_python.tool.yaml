schema: relurpify/tool/v1
name: cli_python
version: "1"
family: build
intent:
  - build
  - python
description: |
  Escape hatch: Executes arbitrary Python commands with python3.
  Prefer python_pytest, python_unittest, or python_compile_check for structured output.
guidance:
  avoid_when:
    - "A python_pytest, python_unittest, or python_compile_check tool handles your use case"
execution:
  backend: subprocess
  command:
    base:
      - python3
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
