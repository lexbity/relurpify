schema: relurpify/tool/v1
name: cli_lsof
version: "1"
family: system
intent:
  - inspect
  - process
description: Lists open files and sockets via lsof.
execution:
  backend: subprocess
  command:
    base:
      - lsof
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
