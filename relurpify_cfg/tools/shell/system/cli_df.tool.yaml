schema: relurpify/tool/v1
name: cli_df
version: "1"
family: system
intent:
  - inspect
  - storage
description: Reports disk usage statistics with df.
execution:
  backend: subprocess
  command:
    base:
      - df
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
