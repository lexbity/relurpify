schema: relurpify/tool/v1
name: cli_time
version: "1"
family: system
intent:
  - measure
  - timing
description: Times the execution of commands with /usr/bin/time.
execution:
  backend: subprocess
  command:
    base:
      - time
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
    - process_spawn
