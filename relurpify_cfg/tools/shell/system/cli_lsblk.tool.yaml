schema: relurpify/tool/v1
name: cli_lsblk
version: "1"
family: system
intent:
  - inspect
  - storage
description: Lists block devices via lsblk.
execution:
  backend: subprocess
  command:
    base:
      - lsblk
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - process_spawn
