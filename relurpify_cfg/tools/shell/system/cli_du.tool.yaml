schema: relurpify/tool/v1
name: cli_du
version: "1"
family: system
intent:
  - inspect
  - storage
description: Summarizes directory usage with du.
execution:
  backend: subprocess
  command:
    base:
      - du
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
    - process_spawn
