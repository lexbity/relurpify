schema: relurpify/tool/v2
name: pipe_fd_rg
version: "1"
family: shell
intent:
  - search
  - pipeline
description: Finds Go files with fd then searches them with rg using a composite pipeline.
execution:
  backend: composite
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
composition:
  steps:
    - tool: cli_fd
      args:
        pattern: "*.go"
      alias: files
    - tool: cli_rg
      args:
        pattern: ${pattern}
        paths: "${files.stdout}"
      alias: matches
