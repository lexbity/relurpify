schema: relurpify/tool/v1
name: cli_rg
version: "1"
family: fileops
intent:
  - search
description: Uses ripgrep (rg) for recursive code search.
execution:
  backend: subprocess
  command:
    base:
      - rg
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - read_only
  effect_class:
    - filesystem_read
    - process_spawn
