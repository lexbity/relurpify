schema: relurpify/tool/v1
name: cli_ag
version: "1"
family: fileops
intent:
  - search
description: Searches codebases with the silver searcher (ag).
execution:
  backend: subprocess
  command:
    base:
      - ag
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
