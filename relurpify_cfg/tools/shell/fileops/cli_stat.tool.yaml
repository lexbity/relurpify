schema: relurpify/tool/v1
name: cli_stat
version: "1"
family: fileops
intent:
  - inspect
  - metadata
description: Shows file metadata with stat.
execution:
  backend: subprocess
  command:
    base:
      - stat
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - read_only
  effect_class:
    - filesystem_read
    - process_spawn
