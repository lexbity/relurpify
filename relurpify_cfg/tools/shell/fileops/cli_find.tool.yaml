schema: relurpify/tool/v1
name: cli_find
version: "1"
family: fileops
intent:
  - locate
  - browse
description: Searches the filesystem using find.
execution:
  backend: subprocess
  command:
    base:
      - find
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - read_only
  effect_class:
    - filesystem_read
    - process_spawn
