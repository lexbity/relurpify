schema: relurpify/tool/v1
name: cli_xxd
version: "1"
family: text
intent:
  - inspect
  - hex
description: Creates hex dumps with xxd.
execution:
  backend: subprocess
  command:
    base:
      - xxd
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
