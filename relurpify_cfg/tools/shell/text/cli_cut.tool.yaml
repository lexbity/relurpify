schema: relurpify/tool/v1
name: cli_cut
version: "1"
family: text
intent:
  - transform
  - select
description: Extracts fields from text with cut.
execution:
  backend: subprocess
  command:
    base:
      - cut
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
