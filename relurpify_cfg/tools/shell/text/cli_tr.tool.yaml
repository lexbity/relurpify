schema: relurpify/tool/v1
name: cli_tr
version: "1"
family: text
intent:
  - transform
description: Translates characters and text with tr.
execution:
  backend: subprocess
  command:
    base:
      - tr
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
  effect_class:
    - filesystem_read
