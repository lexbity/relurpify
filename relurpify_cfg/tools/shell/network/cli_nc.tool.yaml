schema: relurpify/tool/v1
name: cli_nc
version: "1"
family: network
intent:
  - probe
  - tcp
description: Creates TCP/UDP connections via netcat (nc).
execution:
  backend: subprocess
  command:
    base:
      - nc
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
    network_access: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - network
  effect_class:
    - process_spawn
