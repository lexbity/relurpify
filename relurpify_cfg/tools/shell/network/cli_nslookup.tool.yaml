schema: relurpify/tool/v1
name: cli_nslookup
version: "1"
family: network
intent:
  - dns
  - probe
description: Performs DNS lookups via nslookup.
execution:
  backend: subprocess
  command:
    base:
      - nslookup
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
    allow_flags: true
    network_access: true
  allow_stdin: true
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - execute
    - network
  effect_class:
    - process_spawn
