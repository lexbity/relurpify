schema: relurpify/tool/v1
name: file_search
version: "1"
family: file
intent:
  - file
description: Searches text inside files.
parameters:
  - name: directory
    type: string
    description: ""
    required: false
    default: .
  - name: pattern
    type: string
    description: ""
    required: true
    default: null
  - name: case_sensitive
    type: bool
    description: ""
    required: false
    default: false
execution:
  backend: go_native
  implementation: file_search
  sandbox:
    allowed_root: ${workspace}
    timeout_seconds: 30
  supports_workdir: true
capability:
  trust_class: builtin_trusted
  risk_class:
    - read_only
  effect_class:
    - filesystem_read
