schema: relurpify/workspace/v1

# Workspace-local state lives outside relurpify_cfg/.
paths:
  state_dir: .relurpify_state

model:
  provider: ollama
  name: gemma4:e4b

sandbox:
  backend: gvisor

logging:
  level: info
  format: json

audit:
  retention_days: 7

telemetry:
  enabled: false

agents:
  - name: euclo
    filesystem:
      - action: [fs:read, fs:list, fs:write, fs:create, fs:execute]
        path: "${workspace}/**"
        exclude:
          - "${workspace}/relurpify_cfg/**"
          - "${workspace}/.git/**"

  - name: rex
    filesystem:
      - action: [fs:read, fs:list]
        path: "${workspace}/**"
        exclude:
          - "${workspace}/relurpify_cfg/**"

  - name: testfu
    model: gemma4:e4b
    filesystem:
      - action: [fs:read, fs:list]
        path: "${workspace}/**"
        exclude:
          - "${workspace}/relurpify_cfg/**"
      - action: [fs:write, fs:create]
        path: "${workspace}/.relurpify_state/test_run/**"

  - name: factory
