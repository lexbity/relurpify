schema: relurpify/agent/v1
kind: agent
name: euclo
sandbox:
  runtime: gvisor
  image: ghcr.io/lexcodex/relurpify/runtime:latest
  limits:
    cpu: "2"
    memory: 4Gi
    disk_io: 200MBps
  security:
    run_as_user: 1000
    read_only_root: false
    no_new_privileges: true
model:
  name: gemma4:e4b
  temperature: 0.2
  max_tokens: 4096
filesystem:
  - action: [fs:read, fs:list, fs:write, fs:execute]
    path: "${workspace}/**"
capabilities:
  relurpic:
    - euclo:cap.test_run
    - euclo:cap.ast_query
    - euclo:cap.symbol_trace
    - euclo:cap.call_graph
    - euclo:cap.blame_trace
    - euclo:cap.bisect
    - euclo:cap.code_review
    - euclo:cap.diff_summary
    - euclo:cap.layer_check
    - euclo:cap.targeted_refactor
    - euclo:cap.rename_symbol
    - euclo:cap.api_compat
    - euclo:cap.boundary_report
    - euclo:cap.coverage_check
audit:
  level: verbose
  retention_days: 7
network:
  allow:
    - host: localhost
      port: 11434
      protocol: tcp
