schema: relurpify/agent/v1
kind: base
sandbox:
  runtime: gvisor
  image: ghcr.io/lexcodex/relurpify/runtime:0.4.1
  limits:
    cpu: "2"
    memory: 4Gi
    disk_io: 200MBps
  security:
    run_as_user: 1000
    run_as_group: 1000
    read_only_root: true
    no_new_privileges: true
audit:
  level: verbose
  retention_days: 7
network:
  allow:
    - host: localhost
      port: 11434
      protocol: tcp
execution:
  max_iterations: 16
  checkpoint_policy: on_phase
  hitl_timeout_seconds: 300
