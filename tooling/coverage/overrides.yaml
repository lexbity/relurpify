# Per-package coverage floors below the 70% default.
#
# This file is the ratchet: the coverage gate fails the moment a package
# drops below its recorded floor. Raise an entry as coverage improves and
# delete it once the package reaches the default floor. Floors may only be
# raised or removed through this file, never lowered silently -- regenerating
# the baseline (make coverage-baseline) refuses any package that regressed
# below its floor, and packages not listed here are held to the default.
