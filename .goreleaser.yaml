version: 2

project_name: relurpify

# Release build matrix.
#
# Decision 3 of the build spec calls for ellipsis discovery (main: ./...) so a
# single build entry covers every main package. GoReleaser supports that since
# v2.15, but it infers binary names from directory names (go build semantics)
# and hard-errors when `binary` or `id` is also set while more than one main is
# discovered (internal/builders/golang/build.go: checkBuildElipsis). Ellipsis
# discovery therefore cannot produce a `dev-agent` binary from
# app/dev-agent-cli, and `./...` would additionally sweep in
# tooling/coverage/cmd/coverage, which is internal tooling and not a release
# artifact. Binary identity is set explicitly per entry instead. Entries are
# spelled out in full rather than YAML-merged: every entry is independently
# reviewable, and the portability differences below are visible at a glance.
#
# Portability note (verified with GOOS/GOARCH cross-builds): four of the seven
# binaries transitively import platform/fs (syscall.O_NOFOLLOW) and
# capability/sandbox (syscall.Setpgid, syscall.Kill), which have no Windows
# build-tag split and no Windows equivalents in the tree. Porting them is a
# production-code change outside this phase's blast radius, so those binaries
# are scoped to linux/darwin until the sandbox layer gains Windows support.
# The three AST-based tooling binaries (archcheck, domaincheck, driftcheck)
# are pure Go and ship on all three platforms.
#
# CGO is disabled for every target. Cross-compilation already forces this for
# five of the six targets and the tree has no cgo imports, so making the
# native build explicit keeps every binary static, portable, and
# byte-identical across build machines (NFR-6).
builds:
  - id: relurpish
    main: ./app/relurpish
    binary: relurpish
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: dev-agent
    main: ./app/dev-agent-cli
    binary: dev-agent
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: relurplint
    main: ./app/relurplint
    binary: relurplint
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: generate-config
    main: ./userconfig/templates/cmd/generate-config
    binary: generate-config
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: archcheck
    main: ./tooling/arch/cmd/archcheck
    binary: archcheck
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: domaincheck
    main: ./tooling/arch/cmd/domaincheck
    binary: domaincheck
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: driftcheck
    main: ./tooling/driftcheck
    binary: driftcheck
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One archive per platform carrying every binary that builds for it, plus the
# default license/README files. Binaries sit at the archive root (no wrap
# directory) because the AUR package() function installs them from there.
#
# Combined per-platform archives are a Phase 4 requirement, not a preference:
# the AUR pipe accepts exactly one archive per architecture
# (internal/pipe/aur/aur.go: ErrMultipleArchivesSameArch), so per-binary
# archives cannot feed it. `allow_different_binary_count` acknowledges the
# intentional per-platform difference (see the portability note above: the
# three AST tooling binaries also build for Windows). Binaries stay in the
# per-target unique dist dirs (dist/<id>_<target>/).
archives:
  - id: relurpify
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    allow_different_binary_count: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Linux packages. No contents list is needed for the binaries: the nFPM pipe
# adds every linux binary of each platform group to bindir (/usr/bin) on its
# own, so all seven binaries land under /usr/bin/ automatically and new
# binaries are packaged without editing this section.
nfpms:
  - package_name: relurpify
    formats:
      - deb
      - rpm
    vendor: Relurpify Authors
    homepage: https://github.com/lexbit/relurpify
    maintainer: Prestin Liu <liuprestin@gmail.com>
    description: |
      Fullstack agent framework for LLM-driven coding agents.
      Includes relurpish (TUI), dev-agent (test runner), relurplint (linter),
      and internal tooling.
    license: Apache-2.0

# Arch Linux binary package. `ids` pairs this with the combined archive above
# (one archive per arch: x86_64, aarch64). No runtime depends: every binary is
# built with CGO_ENABLED=0 and has no cgo imports, so the releases are
# statically linked and pull in no shared libraries. Publishing needs the
# AUR_SSH_KEY secret and the relurpify-bin AUR repository; snapshot builds
# only generate the PKGBUILD/.SRCINFO under dist/aur/ and never push.
aurs:
  - name: relurpify-bin
    homepage: "https://github.com/lexbit/relurpify"
    description: "Fullstack agent framework for LLM-driven coding agents"
    maintainers:
      - "Prestin Liu <liuprestin@gmail.com>"
    license: "Apache-2.0"
    private_key: "{{ .Env.AUR_SSH_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/relurpify-bin.git"
    ids:
      - relurpify
    package: |
      install -Dm755 "./relurpish" "${pkgdir}/usr/bin/relurpish"
      install -Dm755 "./dev-agent" "${pkgdir}/usr/bin/dev-agent"
      install -Dm755 "./relurplint" "${pkgdir}/usr/bin/relurplint"
      install -Dm755 "./generate-config" "${pkgdir}/usr/bin/generate-config"
      install -Dm755 "./archcheck" "${pkgdir}/usr/bin/archcheck"
      install -Dm755 "./domaincheck" "${pkgdir}/usr/bin/domaincheck"
      install -Dm755 "./driftcheck" "${pkgdir}/usr/bin/driftcheck"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

release:
  github:
    owner: lexbit
    name: relurpify
  draft: true
