apiVersion: euclo.recipe/v1
kind: ThoughtRecipe
id: euclo.recipe.intent.clarify
name: Intent Clarification
description: Clarify ambiguous intake, ground confirmed entities, project clarified state, and requery with grounded anchors.
version: 1.0.0

sequence:
  steps:
    - id: clarify
      type: intent_clarify
      capability_id: euclo:cap.intent.clarify
      config:
        action: request
        validation_mode: partial
        requery_on_success: true
        state_write_keys:
          - euclo.intent.clarification.pending_questions

    - id: ground
      type: intent_ground
      capability_id: euclo:cap.intent.clarify
      config:
        action: ground
        output_schema_id: clarification.grounding.v1
        validation_mode: partial
        requery_on_success: true
        state_write_keys:
          - euclo.intent.clarification.grounded_anchors

    - id: project
      type: intent_project
      capability_id: euclo:cap.intent.clarify
      config:
        action: project
        output_schema_id: clarification.project.v1
        validation_mode: partial
        state_write_keys:
          - euclo.intent.clarification.projected_mutations
          - euclo.projection.mutation_result

    - id: requery
      type: intent_retrieve
      capability_id: euclo:cap.intent.clarify
      config:
        action: requery
        output_schema_id: clarification.requery.v1
        validation_mode: partial
        state_write_keys:
          - euclo.clarification.requery_request

    - id: handoff
      type: intent_handoff
      capability_id: euclo:cap.intent.clarify
      config:
        action: handoff
        validation_mode: partial
        state_write_keys:
          - euclo.clarification.next_recipe_id
